
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laura's Story | M. A. Harrington</title>

    <style>
        body {
            margin: 0;
            padding: 30px 15px;
            background: #1a1a2e;
            color: #f5ead7;
            font-family: Georgia, serif;
            text-align: center;
            line-height: 1.7;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1, h2 {
            color: #f2a65a;
        }

        h1 {
            margin-bottom: 10px;
        }

        .author {
            margin-bottom: 25px;
            font-style: italic;
        }

        .cover {
            max-width: 300px;
            width: 90%;
            height: auto;
            margin: 20px auto;
            border-radius: 8px;
        }

        .section {
            margin: 40px 0;
        }

        .button {
            display: inline-block;
            padding: 12px 24px;
            margin: 10px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
        }

        .button-gold {
            background: #f2a65a;
            color: #1a1a2e;
        }

        .button-outline {
            border: 2px solid #f2a65a;
            color: #f2a65a;
        }

        .pdf-viewer {
            width: 100%;
            height: 700px;
            border: 1px solid #f2a65a;
            border-radius: 6px;
            background: #ffffff;
        }

        .back-link {
            display: inline-block;
            margin-top: 35px;
            color: #f2a65a;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            .pdf-viewer {
                height: 500px;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <h1>Laura's Story</h1>
        <p class="author">By M. A. Harrington</p>

        <img
            src="Laura-story-cover.jpg"
            alt="Laura's Story book cover"
            class="cover"
        >

        <div class="section">
            <h2>Read the Preview</h2>

            <iframe
                src="Laura-story-preview.pdf"
                class="pdf-viewer"
                title="Laura's Story Preview">
            </iframe>

            <a
                href="Laura-story-preview.pdf"
                class="button button-outline"
                target="_blank">
                Read / Download Preview
            </a>
        </div>

        <div class="section">
            <h2>Read the Complete Story</h2>

            <iframe
                src="Laura-story.pdf"
                class="pdf-viewer"
                title="Laura's Story Complete Story">
            </iframe>

            <a
                href="Laura-story.pdf"
                class="button button-gold"
                target="_blank">
                Read / Download Free
            </a>
        </div>

        <a href="index.html" class="back-link">
            Return to M. A. Harrington's Home Page
        </a>

    </div>
</body>
</html>
